name: Preserve verified GFN fix
on: [push]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 455f4b580abb7ae523f392ec21763b3c88bf2ddd
          persist-credentials: false
      - name: Validate evidence and preserve only the tested source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, time, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          repository = 'Producdevity/GreenOvercast'
          run_id = 36495196097
          verified_head = 'd980e28cbf028e16831922d3d5752a71fb38445e'
          base = '455f4b580abb7ae523f392ec21763b3c88bf2ddd'
          base_tree = '15167c4fa2e89e0296fdf405080039732d95c069'
          branch = 'fix/gfn-atomics-20260928'
          allowed = {'README.md', 'build.zig', 'tools/build-dependencies.sh', 'tools/package-portmaster.sh', 'tools/check-aarch64-runtime.sh', 'tests/aarch64_runtime_test.sh', 'tests/dependency_toolchain_test.sh'}
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  result = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if result is not None and urllib.parse.urlparse(newurl).hostname != 'api.github.com':
                      result.remove_header('Authorization')
                  return result
          opener = urllib.request.build_opener(SafeRedirect())
          def api(path, payload=None, raw=False):
              url = 'https://api.github.com/repos/' + repository + '/' + path
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, headers=headers, method='GET' if payload is None else 'POST')
              with opener.open(request, timeout=60) as response:
                  body = response.read()
              return body if raw else json.loads(body)
          for attempt in range(120):
              run = api(f'actions/runs/{run_id}')
              assert run['head_sha'] == verified_head, run['head_sha']
              if run['status'] == 'completed':
                  assert run['conclusion'] == 'success', run['conclusion']
                  break
              time.sleep(10)
          else:
              raise RuntimeError('Verification did not complete; no branch was created')
          artifacts = api(f'actions/runs/{run_id}/artifacts')['artifacts']
          matches = [item for item in artifacts if item['name'] == 'greenovercast-fix-evidence' and not item['expired']]
          assert len(matches) == 1
          archive = zipfile.ZipFile(io.BytesIO(api(f"actions/artifacts/{matches[0]['id']}/zip", raw=True)))
          def evidence(name):
              matches = [path for path in archive.namelist() if Path(path).name == name]
              assert len(matches) == 1, (name, matches)
              return archive.read(matches[0])
          outcomes = json.loads(evidence('outcomes.json'))
          assert set(outcomes) == {'BASELINE', 'FOCUSED', 'FORMAT', 'HOST', 'SMOKE', 'PRODUCT', 'INSPECT'}
          assert all(value == 'success' for value in outcomes.values()), outcomes
          patch = evidence('greenovercast-atomics-fix.patch')
          changed = subprocess.check_output(['git', 'apply', '--numstat', '-'], input=patch).decode().splitlines()
          assert {line.split('\t', 2)[2] for line in changed} == allowed, changed
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert set(staged) == allowed, staged
          tree = []
          for name in sorted(allowed):
              mode = subprocess.check_output(['git', 'ls-files', '-s', '--', name], text=True).split()[0]
              blob = api('git/blobs', {'content': Path(name).read_text(), 'encoding': 'utf-8'})
              tree.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': blob['sha']})
          result_tree = api('git/trees', {'base_tree': base_tree, 'tree': tree})
          expected_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert result_tree['sha'] == expected_tree, (result_tree['sha'], expected_tree)
          commit = api('git/commits', {'message': 'fix: prevent unresolved AArch64 atomic helpers in releases\n\nDisable outlined atomics for Zig and C/C++ release code, invalidate stale\ndependency caches, and validate final ELF imports before release/packaging.\nAdd real ARM64 compiler regressions and dependency-cache tests.\n\nVerified with failing controls, host tests, ABI smoke, full product-check,\nand all 10 final ELF artifacts in Actions run 36495196097.', 'tree': result_tree['sha'], 'parents': [base]})
          api('git/refs', {'ref': 'refs/heads/' + branch, 'sha': commit['sha']})
          summary = {'commit': commit['sha'], 'branch': branch, 'base': base, 'tree': result_tree['sha'], 'patch_sha256': hashlib.sha256(patch).hexdigest(), 'verification_run': run_id, 'outcomes': outcomes, 'artifacts': json.loads(evidence('elf-results.json'))}
          print('VERIFIED_SUMMARY=' + json.dumps(summary))
          for name in ['before-summary.txt', 'focused-tests.log', 'fmt-check.log', 'host-tests.log', 'smoke-build.log', 'product-build.log']:
              text = evidence(name).decode(errors='replace')
              lines = [line for line in text.splitlines() if any(term in line for term in ['Build Summary:', 'tests passed', 'PASS:', 'passed', 'Expected failures confirmed:'])]
              print('EVIDENCE ' + name + ':\n' + '\n'.join(lines[-35:]))
          print('PATCH_BEGIN\n' + patch.decode() + '\nPATCH_END')
          Path('/tmp/gfn-verification-summary.json').write_text(json.dumps(summary, indent=2))
          Path('/tmp/greenovercast-atomics-fix.patch').write_bytes(patch)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: greenovercast-reviewed-fix
          path: |
            /tmp/gfn-verification-summary.json
            /tmp/greenovercast-atomics-fix.patch
          retention-days: 30
          if-no-files-found: error
