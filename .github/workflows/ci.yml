name: GFN ABI verification
on: [push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev pkg-config
      - run: tools/bootstrap.sh
      - run: tools/zig.sh build fmt-check
      - run: tools/zig.sh build test -j2 --summary all
      - run: tools/zig.sh build smoke -j2 --summary all
      - run: tools/zig.sh build product-check -j2 --summary all
      - name: Record baseline ELF imports
        if: always()
        run: |
          mkdir -p .agents/verification
          git rev-parse HEAD > .agents/verification/revision.txt
          if test -f zig-out/bin/webrtc_stream; then
            readelf -h zig-out/bin/webrtc_stream > .agents/verification/elf-header.txt
            readelf -W --dyn-syms zig-out/bin/webrtc_stream > .agents/verification/dynamic-symbols.txt
            sha256sum zig-out/bin/webrtc_stream > .agents/verification/binary.sha256
          fi
      - name: Prepare offline build inputs
        if: always()
        run: |
          tar --exclude='./.tools/build' --exclude='./.tools/cache' \
            --exclude='./.tools/deps' --exclude='./.tools/sources' \
            --exclude='./.zig-cache' \
            -czf "$RUNNER_TEMP/greenovercast-offline-inputs.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: greenovercast-offline-inputs
          path: ${{ runner.temp }}/greenovercast-offline-inputs.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
