name: Offline verification inputs
on: [push]
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: tools/bootstrap.sh
      - name: Fetch pinned dependency archives without compiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tools/build-dependencies.sh').read_text()
          before, marker, after = source.partition('export ZIG_GLOBAL_CACHE_DIR=')
          assert marker
          Path('tools/.prefetch-inputs.sh').write_text(before + '\nexit 0\n')
          PY
          sh tools/.prefetch-inputs.sh
          rm tools/.prefetch-inputs.sh
      - name: Export offline inputs
        run: |
          tar --exclude='./.tools/build' --exclude='./.tools/cache' \
            --exclude='./.tools/deps' --exclude='./.tools/sources' \
            --exclude='./.zig-cache' \
            -czf "$RUNNER_TEMP/greenovercast-offline-inputs.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: greenovercast-offline-inputs
          path: ${{ runner.temp }}/greenovercast-offline-inputs.tar.gz
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
